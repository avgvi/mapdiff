[package]
name = "mapdiff-server"
description = "Local HTTP API for the UI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
axum = "0.8.9"
include_dir = "0.7.4"
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.7.1", features = ["fs"] }
mapdiff-core.workspace = true
mapdiff-gitdiff.workspace = true
mapdiff-extract.workspace = true
mapdiff-graph.workspace = true

[lints]
workspace = true

[dev-dependencies]
mapdiff-testkit.workspace = true
tower = { version = "0.5.3", features = ["util"] }
