[build-system]
requires = ["maturin>=1.13,<2"]
build-backend = "maturin"

[project]
name = "mapdiff"
description = "Review a change on a map of your code: diffs by function and type, drawn with what they touch"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["code-review", "diff", "visualization", "tree-sitter", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
    "Topic :: Software Development",
    "Topic :: Software Development :: Version Control :: Git",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://avgvi.github.io/mapdiff/"
Repository = "https://github.com/avgvi/mapdiff"
Changelog = "https://github.com/avgvi/mapdiff/blob/main/CHANGELOG.md"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/mapdiff-cli/Cargo.toml"
strip = true
